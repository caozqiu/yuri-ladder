name: Hourly ladder sync and deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: yuri-ladder-production
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      YURI_DATA_DIR: .runtime
      YURI_CHECKPOINT_DIR: .checkpoint/state
      YURI_PUBLIC_DATA_DIR: .checkpoint/public
      YURI_SYNC_MINUTES: '45'
      EDGEONE_SITE: ${{ vars.EDGEONE_SITE || 'china' }}
      EDGEONE_CONFIGURED: ${{ secrets.EDGEONE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
      - run: npm ci
      - name: Restore durable checkpoint branch
        run: node scripts/state-branch.mjs restore
      - name: Build collector and frontend
        run: npm run build
      - name: Verify access to the existing EdgeOne project
        if: env.EDGEONE_CONFIGURED == 'true'
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: node scripts/deploy.mjs --check-only
      - name: Remove old compiled artifacts containing embedded owner credentials
        if: github.event_name == 'push' && github.run_attempt == 1 && contains(github.event.head_commit.message, '[rotate-owner]')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/purge-credential-artifacts.mjs
      - name: Configure sponsor owner access without exposing credentials
        if: env.EDGEONE_CONFIGURED == 'true'
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          YURI_ROTATE_OWNER_PASSWORD: ${{ github.event_name == 'push' && github.run_attempt == 1 && contains(github.event.head_commit.message, '[rotate-owner]') && '1' || '0' }}
        run: node scripts/provision-sponsors.mjs
      - name: Upgrade and export complete ranking observations
        id: history
        env:
          YURI_AUTOMATION_ENABLED: ${{ secrets.EDGEONE_API_TOKEN != '' && '1' || '0' }}
        run: node collector/collector.mjs export
      - name: Resume official-source sync
        id: sync
        if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[publish-only]')
        continue-on-error: true
        env:
          YURI_AUTOMATION_ENABLED: ${{ secrets.EDGEONE_API_TOKEN != '' && '1' || '0' }}
        run: |
          set +e
          node collector/collector.mjs sync
          result=$?
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          if [ "$result" -eq 75 ]; then exit 0; fi
          exit "$result"
      - name: Save complete data and unfinished pagination
        if: always() && (steps.sync.outcome != 'skipped' || steps.history.outcome == 'success')
        run: node scripts/state-branch.mjs save
      - name: Rebuild with complete publication
        run: npm run build
      - name: Verify counts and readonly API
        run: npm test
      - name: Save ready-to-upload website
        uses: actions/upload-artifact@v4
        with:
          name: edgeone-ready-site
          path: dist/
          retention-days: 1
      - name: Deploy the same free project
        if: env.EDGEONE_CONFIGURED == 'true'
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: |
          if [ -z "$EDGEONE_API_TOKEN" ]; then
            echo 'Set EDGEONE_API_TOKEN in repository Actions secrets before publishing.'
            exit 1
          fi
          node scripts/deploy.mjs
      - name: Verify public statistics after deployment
        if: env.EDGEONE_CONFIGURED == 'true'
        run: node scripts/verify-public.mjs
      - name: Verify sponsor storage, import and moderation
        if: env.EDGEONE_CONFIGURED == 'true'
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: node scripts/verify-sponsors.mjs
      - name: Verify member registration, profiles and privacy in isolated storage
        if: env.EDGEONE_CONFIGURED == 'true'
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: node scripts/verify-accounts.mjs
      - name: Verify one owner-authorized temporary member account once
        if: github.event_name == 'push' && github.run_attempt == 1 && contains(github.event.head_commit.message, '[verify-member-once]') && env.EDGEONE_CONFIGURED == 'true'
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: node scripts/verify-live-account.mjs
      - name: Verify two owner-authorized temporary pending submissions once
        if: github.event_name == 'push' && github.run_attempt == 1 && contains(github.event.head_commit.message, '[verify-pending]') && env.EDGEONE_CONFIGURED == 'true'
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: node scripts/verify-live-submissions.mjs
      - name: Save compiled upload package
        if: env.EDGEONE_CONFIGURED == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path('dist/.edgeone')
          assert (root / 'assets/index.html').is_file()
          assert (root / 'edge-functions/config.json').is_file()
          with ZipFile('.runtime/edgeone-compiled-site.zip', 'w', ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob('*')):
                  if path.is_file():
                      archive.write(path, path.relative_to(root).as_posix())
          PY
      - name: Remove owner credentials from shareable compiled artifact
        if: env.EDGEONE_CONFIGURED == 'true'
        run: node scripts/compiled-artifacts.mjs .runtime/edgeone-compiled-site.zip
      - name: Save executable deployment artifact
        if: env.EDGEONE_CONFIGURED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: edgeone-compiled-site
          path: .runtime/edgeone-compiled-site.zip
          retention-days: 7
      - name: Save production verification
        if: env.EDGEONE_CONFIGURED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: production-verification
          path: |
            .runtime/public-verification.json
            .runtime/sponsor-verification.json
            .runtime/live-submission-verification.json
            .runtime/live-submission-cleanup.json
            .runtime/owner-access-verification.json
            .runtime/account-verification.json
            .runtime/live-account-verification.json
            .runtime/live-account-cleanup.json
          retention-days: 7
      - name: Report publishing setup still needed
        if: env.EDGEONE_CONFIGURED != 'true'
        run: |
          echo 'Data sync and upload artifact are ready. Website deployment is waiting for EDGEONE_API_TOKEN.' >> "$GITHUB_STEP_SUMMARY"
      - name: Report source failure after retaining last complete publication
        if: steps.sync.outputs.exit_code == '1'
        run: |
          echo 'Source sync paused or failed; checkpoint retained and last complete data published. Review sync_progress logs.'
          exit 1
